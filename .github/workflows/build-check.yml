name: Frontend Build Check

on:
  # Only the default branch on push - without this filter, a pull request from a branch in this
  # same repo triggered two identical runs (one for the push, one for the PR).
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build_test:
    name: Check frontend build passes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend (strict)
        run: npm run build:strict

      - name: Verify entity-discovery resolver against fixture
        run: npm run verify

      - name: Smoke-test the built bundle renders without throwing
        run: npm run smoke
