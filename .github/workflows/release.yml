name: Release

on:
  release:
    types:
      - released

jobs:
  build_release:
    name: Build and attach frontend bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Update package.json version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          npm version "$VERSION" --no-git-tag-version

      - name: Install Node dependencies
        run: npm ci

      # The artifact attached here is what HACS and the manual install steps actually ship, so it
      # gets the same checks as CI - previously this ran the lenient `npm run build`
      # (IGNORE_TS_ERRORS=true) and skipped `verify` entirely, making the released bundle the
      # least-checked build in the repo.
      - name: Build frontend (strict)
        run: npm run build:strict

      - name: Verify entity-discovery resolver against fixture
        run: npm run verify

      - name: Smoke-test the built bundle renders without throwing
        run: npm run smoke

      - name: Attach build to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.js
